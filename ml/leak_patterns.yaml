# Фразы-маркеры разметки методологов, которые удаляются из описаний позитивов (§6.1 HANDOFF).
# Без очистки модель выучивает не признаки технологии, а язык колонок «Почему это слабый сигнал»
# и «Тренд упоминаний». Полнота списка проверяется командой `leak-check`.
version: 1
patterns:
  - "слаб\\w*\\s+сигнал\\w*"
  - "weak\\s+signal\\w*"
  - "зарожда\\w+"
  - "растёт\\s+быстро"
  - "растет\\s+быстро"
  - "рост\\s+упоминани\\w+"
  - "тренд\\s+упоминани\\w+"
  - "стабильн\\w+\\s+тренд\\w*"
  - "стадия\\s+развития"
  - "прототип/poc"
  - "ранн\\w+\\s+внедрение"
  - "пилот\\s*→\\s*\\w+"
  - "почти\\s+не\\s+обсужда\\w+"
  - "ещё\\s+нет\\s+категори\\w+"
  - "не\\s+обсуждается\\s+как\\s+самостоятельн\\w+"
  - "балл\\s*\\(стадия\\+тренд\\)"
# Токены, по которым leak-check строит контрольную модель: если она даёт F1 > порога,
# список patterns неполон.
marker_tokens:
  - слабый
  - сигнал
  - сигналы
  - зарождающийся
  - зарождающиеся
  - растёт
  - быстро
  - стабильный
  - тренд
  - упоминаний
  - стадия
  - прототип
  - пилот
  - внедрение
  - поc
  - stealth
  - seed
