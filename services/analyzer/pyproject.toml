[project]
name = "analyzer"
version = "1.0.0"
description = "Сервис выявления кандидатов-слабых сигналов: признаки, правила, калиброванная модель (Weak Signals)."
requires-python = ">=3.12"
dependencies = [
  "ws-common",
  "ws-contracts",
  "numpy>=2.0",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "sentence-transformers>=3.0",
  "torch>=2.4",
  "psycopg[binary,pool]>=3.2",
  "grpcio>=1.66.2",
  "grpcio-health-checking>=1.66.2",
  "protobuf>=5.28,<6",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "testcontainers[postgres]>=4.8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyzer"]

[tool.uv.sources]
ws-common = { workspace = true }
ws-contracts = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: требует PostgreSQL (testcontainers)",
  "contract: требует поднятого gRPC-сервера",
  "manual: требует реальной модели e5 и кеша HuggingFace",
]
