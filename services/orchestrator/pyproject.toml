[project]
name = "orchestrator"
version = "1.0.0"
description = "Единая точка входа Weak Signals: HTTP API, очередь заданий и снимок результата."
requires-python = ">=3.12"
dependencies = [
  "ws-common",
  "ws-contracts",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "grpcio>=1.66.2",
  "protobuf>=5.28,<6",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "testcontainers[postgres]>=4.8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.uv.sources]
ws-common = { workspace = true }
ws-contracts = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: требует PostgreSQL (testcontainers)",
  "contract: проверка контракта HTTP",
]
