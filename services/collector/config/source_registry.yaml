# Реестр ресурсов поиска слабых сигналов (этап 4.6) — по документу «02_weak_signals_sources» (11.10.2026).
# resources — 95 карточек R001–R095 (приоритет, тип, официальная страница ресурса из документа);
# domains — 206 доменов ссылок эталона с разделом документа. Ссылки самих эталонных статей сюда НЕ переносятся:
# в слепом поиске используется только корень домена.
# discover: false — ресурс не проверяется на ленты RSS/Atom (причина в reason).
# Команда `python -m collector.tools.archive discover-feeds` находит ленты на страницах ресурсов и в корне доменов,
# проверяет их разбором и сохраняет рабочие в collector.feed_registry; `archive rss` затем ежедневно читает их вместе
# с WS_COLLECTOR_RSS_FEEDS, и записи попадают в архив новостей (источник news_archive при сборе).
