# Правила типа источника и доверенности (§6.5 ТЗ). Публикуются в UI «Методология».
# Изменение файла не требует пересборки образа: файл читается при старте сервиса.
version: 1

# Умолчание адаптера: тип документа и уровень доверенности.
source_defaults:
  openalex:     { type: SCIENTIFIC_PUBLICATION, trust: HIGH }
  arxiv:        { type: PREPRINT,               trust: HIGH }
  patentsview:  { type: PATENT,                 trust: HIGH }
  github:       { type: CODE_REPOSITORY,        trust: MEDIUM }
  hh:           { type: VACANCY,                trust: MEDIUM }
  wikipedia:    { type: ENCYCLOPEDIA,           trust: MEDIUM }
  rss:          { type: INDUSTRY_MEDIA,         trust: MEDIUM }
  semantic_scholar: { type: SCIENTIFIC_PUBLICATION, trust: HIGH }
  # Zenodo почти без модерации: препринт оттуда не равен препринту arXiv — потолок MEDIUM.
  zenodo:       { type: PREPRINT,               trust: MEDIUM, trust_ceiling: MEDIUM }
  # Новости о пилотах, контрактах и финансировании: подсказывают деловой сигнал, но не подтверждают его в одиночку.
  gdelt:        { type: INDUSTRY_MEDIA,         trust: MEDIUM }
  # Патенты Роспатента: платформа на домене .gov.ru, но документы — патенты (authoritative: тип адаптера
  # не пересматривается правилом государственных доменов).
  rospatent:    { type: PATENT,                 trust: HIGH, authoritative: true }
  # Hacker News — ссылка на чужую статью: тип по домену ссылки (как у RSS, by_domain), иначе INDUSTRY_MEDIA;
  # агрегатор подсказывает сигнал, но не подтверждает его в одиночку — потолок MEDIUM.
  hackernews:   { type: INDUSTRY_MEDIA,         trust: MEDIUM, trust_ceiling: MEDIUM, by_domain: true }
  # Этап 4.3. Архив новостей: тип по домену статьи, иначе новость; доверенность не выше MEDIUM.
  news_archive: { type: NEWS,                   trust: MEDIUM, trust_ceiling: MEDIUM, by_domain: true }
  crossref:     { type: SCIENTIFIC_PUBLICATION, trust: HIGH }
  huggingface:  { type: CODE_REPOSITORY,        trust: MEDIUM, trust_ceiling: MEDIUM }

# Доверенность по типу источника (применяется после определения типа).
type_trust:
  SCIENTIFIC_PUBLICATION: HIGH
  PREPRINT: HIGH
  PATENT: HIGH
  GOVERNMENT: HIGH
  ANALYTICAL_REPORT: HIGH
  INDUSTRY_MEDIA: MEDIUM
  NEWS: MEDIUM
  CODE_REPOSITORY: MEDIUM
  VACANCY: MEDIUM
  ENCYCLOPEDIA: MEDIUM
  CORPORATE_BLOG: LOW
  PRESS_RELEASE: LOW
  SOCIAL_MEDIA: LOW
  OTHER: LOW

# Государственные, регуляторные и международные источники (проверяются первыми).
government_domains: [europa.eu, bis.org, cbr.ru, oecd.org, un.org, imf.org, who.int, nist.gov]
government_suffixes: ['.gov', '.gov.ru', '.int', '.gov.uk']

# Пресс-релизы и рекламные публикации.
press_release_domains: [prnewswire.com, businesswire.com, globenewswire.com, newswire.ca, interfax.ru/pressreleases]
press_release_title_markers: ['press release', 'пресс-релиз', 'пресс релиз']

# Рекламные и спонсорские материалы: документ с маркером в заголовке или тексте не попадает в коллекцию.
# ТЗ: маркетинг не может быть основанием для сигнала; в v9 три из четырёх карточек темы инфраструктуры ИИ были
# спонсорскими статьями DataCenterDynamics. Сравнение без учёта регистра, «ё» и «е» не различаются.
advertising_markers: ['sponsored:', 'партнёрский материал', 'на правах рекламы']
