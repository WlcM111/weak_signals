[project]
name = "collector"
version = "1.0.0"
description = "Сервис сбора документов из открытых источников (Weak Signals)."
requires-python = ">=3.12"
dependencies = [
  "ws-common",
  "ws-contracts",
  "httpx>=0.27",
  "lxml>=5.3",
  "langdetect>=1.0.9",
  "psycopg[binary,pool]>=3.2",
  "grpcio>=1.66.2",
  "grpcio-health-checking>=1.66.2",
  "protobuf>=5.28,<6",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "testcontainers[postgres]>=4.8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collector"]

[tool.uv.sources]
ws-common = { workspace = true }
ws-contracts = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: требует PostgreSQL (testcontainers)",
  "contract: требует поднятого gRPC-сервера",
]
