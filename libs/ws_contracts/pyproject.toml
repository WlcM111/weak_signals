[project]
name = "ws-contracts"
version = "1.0.0"
description = "Сгенерированные из .proto стабы контрактов Weak Signals 1.0.0."
requires-python = ">=3.12"
dependencies = ["grpcio==1.66.2", "protobuf>=5.28,<6"]

# Генератор стабов нужен только разработчику: `bash tools/gen_proto.sh` и контрактные тесты.
# Версия совпадает с grpcio, иначе gencode окажется новее рантайма protobuf.
[project.optional-dependencies]
dev = ["grpcio-tools==1.66.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weaksignals"]
